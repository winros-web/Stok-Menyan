<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Stok Menyan</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700&family=Archivo:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Tema = Dashboard Svarna (otomasi/susun_induk.py): warna, huruf, kotak menu, merek raksasa, skala 75% di laptop */
:root{color-scheme:dark}
body{margin:0;background:#11171d;color:#e6ecf1;font:19px/1.45 "Aptos Narrow","Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  text-transform:uppercase;letter-spacing:.03em;-webkit-font-smoothing:antialiased}
:root{--skala:1}
@media (min-width:700px){html{zoom:.75}:root{--skala:.75}}

.atas{position:sticky;top:0;z-index:9;background:#11171d;border-bottom:1px solid #2a3642}
.atas .bungkus{padding:0 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap}
.atas .merek{font-weight:600;font-size:24px;letter-spacing:.3em}
.atas .kanan{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:8px}
.atas .waktu{color:#9aa8b5;font-size:14px;letter-spacing:.06em}
button.tipis{font:inherit;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#e6ecf1;background:none;cursor:pointer;
  border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:10px 18px}
button.tipis:hover{border-color:#e6ecf1;background:rgba(255,255,255,.06)}
button.tipis:disabled{opacity:.45;cursor:default}
@property --sorot-x{syntax:"<percentage>";inherits:true;initial-value:0%}
.merek-raksasa{width:100%;color:#e6ecf1;user-select:none;
  -webkit-mask-image:radial-gradient(circle at var(--sorot-x) 50%,#000 0%,transparent 60%);
  mask-image:radial-gradient(circle at var(--sorot-x) 50%,#000 0%,transparent 60%)}
.merek-raksasa svg{display:block;width:100%;height:auto;opacity:.4}
.merek-raksasa text{font-family:"Archivo","Arial Black",sans-serif;font-weight:800}
@keyframes sorot-jalan{from{--sorot-x:0%}to{--sorot-x:100%}}
@media (hover:none){.merek-raksasa{animation:sorot-jalan 7s ease-in-out infinite alternate}}
@media (prefers-reduced-motion:reduce){.merek-raksasa{animation:none;--sorot-x:50%}}
.atas-merek{border-bottom:1px solid #2a3642}
/* di layar kerja merek raksasa disembunyikan supaya tabel dapat tempat (Joe: tampilan penuh layar) */
body:not(.utama) .atas-merek{display:none}

main{margin:24px 0 6vh;padding:0 24px}
body.utama{min-height:calc(100vh / var(--skala));display:flex;flex-direction:column}
body.utama main{flex:1;width:100%;box-sizing:border-box;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;justify-content:center}
body.utama .modul{margin-top:0}
h2{font-size:16px;letter-spacing:.3em;color:#6fb3d2;margin:24px 0 10px}
.pilih{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.cab{background:linear-gradient(165deg,#1d2833,#18212a 60%);border:1px solid #2a3642;border-radius:6px;padding:24px 22px 20px;color:#e6ecf1;
  min-height:150px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;text-decoration:none}
a.cab:hover{border-color:#6fb3d2}
.cab .nama{font-weight:600;font-size:clamp(26px,2.6vw,34px);line-height:1.1;letter-spacing:.04em}
.cab .ket{margin-top:auto;padding-top:10px;color:#9aa8b5;font-size:14px;font-weight:600;letter-spacing:.1em;width:100%}
.modul{margin-top:24px}
.modul .cab{min-height:200px;justify-content:center}
.modul .cab .nama{font-size:clamp(22px,2vw,30px)}
.pilih.modul{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}

/* tambahan untuk formulir dan tabel, memakai warna yang sama */
.kartu{background:linear-gradient(165deg,#1d2833,#18212a 60%);border:1px solid #2a3642;border-radius:6px;padding:22px}
.isian{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px 16px;align-items:end}
.isian label{display:flex;flex-direction:column;gap:6px;color:#9aa8b5;font-size:14px;font-weight:600;letter-spacing:.1em}
.isian .lebar{grid-column:1/-1}
input{font:inherit;font-size:19px;text-transform:none;letter-spacing:.02em;color:#e6ecf1;background:#11171d;border:1px solid #2a3642;
  border-radius:6px;padding:12px 14px;min-width:0;width:100%;box-sizing:border-box}
input:focus,button:focus-visible,a:focus-visible{outline:2px solid #6fb3d2;outline-offset:1px}
input::placeholder{color:#5f6e7b}
input.besar{text-transform:uppercase}
input.salah{border-color:#f0958a}
.tombol{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
button.utama{font:inherit;font-size:17px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#11171d;background:#6fb3d2;
  border:1px solid #6fb3d2;border-radius:999px;padding:12px 28px;cursor:pointer}
button.utama:hover{background:#8cc6e0}
button.utama:disabled{opacity:.5;cursor:default}
.pesan{min-height:1.45em;font-size:16px;letter-spacing:.05em;margin-top:12px}
.pesan.baik{color:#7fd0a0}.pesan.buruk{color:#f0958a}
.gulung{overflow-x:auto;border:1px solid #2a3642;border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:17px}
th,td{padding:11px 14px;border-bottom:1px solid #2a3642;text-align:left;vertical-align:middle}
th{color:#9aa8b5;font-size:13px;font-weight:600;letter-spacing:.12em;background:#18212a;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.angka,th.angka{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.aksi{white-space:nowrap;text-align:right}
td.aksi button{padding:6px 14px;font-size:13px;margin-left:6px}
tr.redup td{color:#5f6e7b}
.minus{color:#f0958a}
.kosong{color:#9aa8b5;padding:18px 14px}
.sempit{max-width:460px;margin:0 auto;width:100%}
.catatan{color:#9aa8b5;font-size:14px;letter-spacing:.06em;margin-top:10px}
.ringkas{display:flex;gap:10px 28px;flex-wrap:wrap;align-items:baseline;margin:14px 0 4px}
.ringkas b{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.ringkas span{color:#9aa8b5;font-size:14px;font-weight:600;letter-spacing:.1em}
/* isian banyak barang (sheet Masuk / Keluar) */
table.baris td{padding:6px 8px;border:0}
table.baris th{background:none;padding:6px 8px;border:0}
table.baris td.qty{width:150px}
table.baris td.sub{width:170px}
table.baris td.buang{width:1%}
@media (max-width:699px){table.baris td.qty{width:92px}table.baris td.sub,table.baris th.sub{display:none}}
/* menu tetap di atas: pindah modul tanpa kembali ke menu utama */
.nav{display:flex;gap:6px;overflow-x:auto;padding:0 24px 10px}
.nav a{white-space:nowrap;text-decoration:none;color:#9aa8b5;font-size:15px;font-weight:600;letter-spacing:.1em;padding:9px 18px;border:1px solid #2a3642;border-radius:999px}
.nav a:hover{color:#e6ecf1;border-color:#6fb3d2}
.nav a.kini{color:#11171d;background:#6fb3d2;border-color:#6fb3d2}
/* formulir dan tabel berdampingan di layar lebar */
.dua{display:grid;gap:24px;align-items:start}
.dua>*{min-width:0}
.dua h2:first-child{margin-top:0}
@media (min-width:1100px){.dua{grid-template-columns:minmax(360px,460px) 1fr}.dua.rata{grid-template-columns:1fr 1fr}}
.judul-cari{display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.judul-cari h2{margin:0}
.judul-cari input{flex:1;min-width:220px}
.saring{display:flex;gap:14px 16px;flex-wrap:wrap;align-items:end}
.saring label{display:flex;flex-direction:column;gap:6px;color:#9aa8b5;font-size:14px;font-weight:600;letter-spacing:.1em;width:200px}
.saring label.cari{flex:1;min-width:260px;width:auto}
.saring .ringkas{margin:0 0 0 auto}
tbody tr:hover td{background:rgba(111,179,210,.07)}
@media (min-width:700px){
  body:not(.utama) .gulung{max-height:calc(100vh / var(--skala) - 215px);overflow:auto}
  .gulung th{position:sticky;top:0;z-index:1}
}
/* stok sebagai petak: nama + angka besar, memenuhi layar */
.pil{display:flex;gap:8px;flex-wrap:wrap}
.pil button.kini{color:#11171d;background:#6fb3d2;border-color:#6fb3d2}
.petak{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.ubin{background:linear-gradient(165deg,#1d2833,#18212a 60%);border:1px solid #2a3642;border-radius:6px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.ubin b{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ubin.nol b{color:#5f6e7b}
.ubin.minus{border-color:#f0958a}
[hidden]{display:none!important}
</style></head>
<body class="utama"><svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="derauMerek"><feTurbulence type="fractalNoise" baseFrequency="1" numOctaves="4" result="derau"/><feComposite in="SourceGraphic" in2="derau" operator="in"/></filter></svg>
<header class="atas"><div class="bungkus"><div class="merek">STOK MENYAN</div><div class="kanan"><span class="waktu" id="waktu"></span><button class="tipis" id="tombolSegar" hidden>Update</button><button class="tipis" id="tombolKeluar" hidden>Keluar</button></div></div><nav class="nav" id="nav" hidden></nav></header>
<div class="atas-merek"><div class="merek-raksasa" aria-hidden="true">
<svg class="tinggi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2468.89 566.93" fill="currentColor"><text x="0" y="546" font-size="760" textLength="2468.89" lengthAdjust="spacingAndGlyphs" filter="url(#derauMerek)">STOK MENYAN</text></svg>
</div></div>
<main id="isi"></main>
<datalist id="pilihBarang"></datalist><datalist id="pilihPelanggan"></datalist>

<script>
"use strict";
// sorot merek raksasa mengikuti tetikus (sama dengan Dashboard Svarna)
let mouseX = null, sorotKini = 0;
document.addEventListener("mousemove", e => { mouseX = e.clientX; });
(function gerakSorot() {
  if (mouseX !== null) {
    for (const el of document.querySelectorAll(".merek-raksasa")) {
      const r = el.getBoundingClientRect();
      if (!r.width) continue;
      const tujuan = Math.min(100, Math.max(0, (mouseX - r.left) / r.width * 100));
      sorotKini += (tujuan - sorotKini) * .12;
      el.style.setProperty("--sorot-x", sorotKini.toFixed(2) + "%");
    }
  }
  requestAnimationFrame(gerakSorot);
})();

// Halaman di GitHub Pages memanggil layanan di Mac Winros lewat Funnel; bila dibuka langsung dari layanan, pakai alamat yang sama.
const API = location.hostname.endsWith("github.io")
  ? "https://svarna5s-mac-mini.tail7a15d8.ts.net:10000/stok-menyan/api/"
  : location.pathname.replace(/[^/]*$/, "") + "api/";
const SIMPAN = "stokMenyanSesi";
// susunan menu = susunan sheet Joe (Master Pembeli di web bernama Master Pelanggan)
const MODUL = [
  ["barang", "MASTER BARANG", "Nama dan harga barang"],
  ["pelanggan", "MASTER PELANGGAN", "Daftar pelanggan dan peti"],
  ["stok", "STOK", "Stok tersedia"],
  ["masuk", "MASUK", "Catat barang masuk"],
  ["keluar", "KELUAR", "Catat barang keluar"],
  ["laporan", "LAPORAN", "Riwayat, saldo, unduh Excel"],
];
const BARIS_AWAL = 5;
document.getElementById("nav").innerHTML = '<a href="#">Menu</a>' + MODUL.map(([k, n]) => `<a href="#${k}">${n}</a>`).join("");
const isi = document.getElementById("isi");
let sesi = null, data = null, ubah = null, saring = { dari: "", sampai: "" };
try { sesi = JSON.parse(localStorage.getItem(SIMPAN)); } catch (e) { sesi = null; }

const aman = t => String(t ?? "").replace(/[&<>"']/g, h => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[h]));
const angka = n => Number(n).toLocaleString("id-ID", { maximumFractionDigits: 3 });
const rupiah = n => "Rp " + Number(n).toLocaleString("id-ID", { maximumFractionDigits: 0 });
const tgl = t => t ? t.slice(8, 10) + "/" + t.slice(5, 7) + "/" + t.slice(0, 4) : "";
const el = id => document.getElementById(id);
const kunci = t => String(t).trim().replace(/\s+/g, " ").toLowerCase();
// "12", "1,5", "1.500" (titik ribuan), "-19,5" -> angka; selain itu NaN
const bacaAngka = t => { t = String(t).trim(); return /^-?\d{1,3}(\.\d{3})*(,\d+)?$|^-?\d+([.,]\d+)?$/.test(t) ? Number(/,/.test(t) || /^-?\d{1,3}(\.\d{3})+$/.test(t) ? t.replace(/\./g, "").replace(",", ".") : t) : NaN; };

class Galat extends Error { constructor(kode, pesan) { super(pesan); this.kode = kode; } }
async function panggil(jalur, badan) {
  const kepala = {};
  if (sesi) kepala.Authorization = "Bearer " + sesi.token;
  if (badan) kepala["Content-Type"] = "application/json";
  let jawab;
  try {
    jawab = await fetch(API + jalur, { method: badan ? "POST" : "GET", headers: kepala, body: badan ? JSON.stringify(badan) : undefined, cache: "no-store" });
  } catch (e) {
    throw new Galat(0, "Tidak tersambung ke server. Periksa internet, lalu coba lagi.");
  }
  if (jalur.startsWith("unduh") && jawab.ok) return jawab;
  let hasil = {};
  try { hasil = await jawab.json(); } catch (e) { /* jawaban bukan JSON */ }
  if (!jawab.ok) {
    if (jawab.status === 401 && sesi && jalur !== "masuk") { lupaSesi(); tampil(); }
    throw new Galat(jawab.status, hasil.galat || "Server menjawab " + jawab.status + ".");
  }
  return hasil;
}
function lupaSesi() { sesi = null; data = null; try { localStorage.removeItem(SIMPAN); } catch (e) { /* penyimpanan diblokir */ } }
function pesan(id, teks, baik) { const p = el(id); if (!p) return; p.textContent = teks; p.className = "pesan " + (baik ? "baik" : "buruk"); }
function kotakGagal(g) {
  document.body.className = "utama";
  isi.innerHTML = `<div class="kartu sempit"><h2 style="margin-top:0">Tidak tersambung</h2><div>${aman(g.message)}</div><div class="tombol"><button class="utama" onclick="location.reload()">Coba lagi</button></div></div>`;
}

async function muat() {
  data = await panggil("data");
  el("waktu").textContent = "DATA " + tgl(data.waktu.slice(0, 10)) + " " + data.waktu.slice(11, 16).replace(":", ".");
  el("pilihBarang").innerHTML = data.barang.filter(b => b.aktif).map(b => `<option value="${aman(b.nama)}">`).join("");
  el("pilihPelanggan").innerHTML = data.pelanggan.filter(p => p.aktif).map(p => `<option value="${aman(p.nama)}">`).join("");
}
// tombol yang harus ditekan dua kali supaya tidak terhapus karena salah sentuh
function duaKali(tombol, jalankan) {
  if (tombol.dataset.yakin) return jalankan();
  const asal = tombol.textContent;
  tombol.dataset.yakin = "1"; tombol.textContent = "Yakin hapus?"; tombol.style.borderColor = tombol.style.color = "#f0958a";
  setTimeout(() => { if (tombol.isConnected) { delete tombol.dataset.yakin; tombol.textContent = asal; tombol.style.borderColor = tombol.style.color = ""; } }, 4000);
}

// ---------- layar ----------
function layarMasuk(siap) {
  document.body.className = "utama";
  el("tombolSegar").hidden = el("tombolKeluar").hidden = el("nav").hidden = true;
  el("waktu").textContent = "";
  if (!siap) { isi.innerHTML = '<div class="kartu sempit"><h2 style="margin-top:0">Belum bisa dipakai</h2><div>Sandi belum diatur. Hubungi Joe.</div></div>'; return; }
  isi.innerHTML = `<form class="kartu sempit" id="formMasuk"><h2 style="margin-top:0">Masuk</h2>
    <div class="isian"><label class="lebar">Sandi<input id="mSandi" type="password" maxlength="200" required autocomplete="current-password"></label></div>
    <div class="tombol"><button class="utama" type="submit">Masuk</button></div><div class="pesan" id="mPesan"></div></form>`;
  el("formMasuk").addEventListener("submit", async e => {
    e.preventDefault();
    const tombol = e.target.querySelector("button"); tombol.disabled = true;
    try {
      sesi = await panggil("masuk", { sandi: el("mSandi").value });
      try { localStorage.setItem(SIMPAN, JSON.stringify(sesi)); } catch (e2) { /* tetap jalan tanpa disimpan */ }
      await tampil();
    } catch (g) { sesi = null; pesan("mPesan", g.message); tombol.disabled = false; }
  });
  el("mSandi").focus();
}

function layarMenu() {
  document.body.className = "utama";
  isi.innerHTML = '<div class="pilih modul">' + MODUL.map(([k, n, ket]) =>
    `<a class="cab" href="#${k}"><div class="nama">${n}</div><div class="ket">${ket}</div></a>`).join("") + "</div>";
}
const kepalaModul = k => `<h2 style="margin-top:0">${MODUL.find(x => x[0] === k)[1]}</h2>`;
function pasangCari(idMasukan) {
  el(idMasukan).addEventListener("input", e => {
    const kata = kunci(e.target.value);
    isi.querySelectorAll("#tabelUtama tbody tr").forEach(b => { b.hidden = !!kata && !b.textContent.toLowerCase().includes(kata); });
  });
}

function layarMaster(jenis) {
  const brg = jenis === "barang";
  const daftar = brg ? data.barang : data.pelanggan;
  const kini = ubah && ubah.jenis === jenis ? daftar.find(x => x.id === ubah.id) : null;
  const kolom = brg
    ? `<label>Nama barang<input id="fNama" class="besar" maxlength="80" required autocomplete="off" value="${aman(kini?.nama)}"></label>
       <label>Harga per 1 barang (Rp)<input id="fHarga" inputmode="numeric" autocomplete="off" placeholder="0" value="${kini ? angka(kini.harga) : ""}"></label>`
    : `<label class="lebar">Nama pelanggan / peti<input id="fNama" maxlength="80" required autocomplete="off" value="${aman(kini?.nama)}"></label>`;
  const baris = daftar.map(x => `<tr class="${x.aktif ? "" : "redup"}"><td>${aman(x.nama)}</td>` +
    (brg ? `<td class="angka">${angka(x.harga)}</td>` : "") +
    `<td>${x.aktif ? "Aktif" : "Tidak dipakai"}</td><td class="aksi"><button class="tipis" data-ubah="${x.id}">Edit</button><button class="tipis" data-aktif="${x.id}">${x.aktif ? "Nonaktifkan" : "Aktifkan"}</button><button class="tipis" data-hapus="${x.id}">Hapus</button></td></tr>`).join("");
  const sebut = brg ? "barang" : "pelanggan";
  isi.innerHTML = `<div class="dua"><div>${kepalaModul(jenis)}<form class="kartu" id="formMaster"><div class="isian">${kolom}</div>
    <div class="tombol"><button class="utama" type="submit">${kini ? "Simpan perubahan" : "Tambah " + sebut}</button>${kini ? '<button class="tipis" type="button" id="fBatal">Tidak jadi</button>' : ""}</div>
    <div class="pesan" id="fPesan"></div></form></div>
    <div><div class="judul-cari"><h2>Daftar ${sebut} (${daftar.length})</h2><input id="fCari" autocomplete="off" placeholder="Cari nama ${sebut}"></div>
    <div class="gulung" id="tabelUtama">${daftar.length ? `<table><thead><tr><th>Nama ${sebut}</th>${brg ? '<th class="angka">Harga per 1 barang</th>' : ""}<th>Status</th><th></th></tr></thead><tbody>${baris}</tbody></table>`
      : `<div class="kosong">Belum ada ${sebut}. Tambahkan lewat isian.</div>`}</div></div></div>`;
  const kirim = async (jalur, badan, berhasil) => {
    try { await panggil(jalur, badan); ubah = null; await muat(); layarMaster(jenis); pesan("fPesan", berhasil, true); }
    catch (g) { pesan("fPesan", g.message); }
  };
  const badanDari = (x, aktif) => brg ? { id: x.id, nama: x.nama, harga: x.harga, aktif } : { id: x.id, nama: x.nama, aktif };
  el("formMaster").addEventListener("submit", e => {
    e.preventDefault();
    const badan = { nama: el("fNama").value };
    if (brg) {
      const harga = el("fHarga").value.trim() === "" ? 0 : bacaAngka(el("fHarga").value);
      if (!Number.isInteger(harga) || harga < 0) return pesan("fPesan", "Harga harus angka bulat, contoh: 530000");
      badan.harga = harga;
    }
    if (kini) kirim(jenis + "/ubah", { ...badan, id: kini.id, aktif: kini.aktif }, "Perubahan tersimpan.");
    else kirim(jenis, badan, "Tersimpan: " + (brg ? badan.nama.trim().toUpperCase() : badan.nama.trim()));
  });
  if (kini) el("fBatal").addEventListener("click", () => { ubah = null; layarMaster(jenis); });
  pasangCari("fCari");
  isi.querySelectorAll("[data-ubah]").forEach(t => t.addEventListener("click", () => { ubah = { jenis, id: +t.dataset.ubah }; layarMaster(jenis); window.scrollTo(0, 0); el("fNama").focus(); }));
  isi.querySelectorAll("[data-aktif]").forEach(t => t.addEventListener("click", () => {
    const x = daftar.find(y => y.id === +t.dataset.aktif);
    kirim(jenis + "/ubah", badanDari(x, !x.aktif), x.nama + (x.aktif ? " dinonaktifkan." : " diaktifkan lagi."));
  }));
  isi.querySelectorAll("[data-hapus]").forEach(t => t.addEventListener("click", () => {
    const x = daftar.find(y => y.id === +t.dataset.hapus);
    duaKali(t, () => kirim(jenis + "/hapus", { id: x.id }, x.nama + " dihapus."));
  }));
}

function layarStok() {
  const daftar = data.barang.filter(b => b.aktif || b.stok !== 0);
  const jenisStok = b => b.stok < 0 ? "minus" : b.stok === 0 ? "nol" : "ada";
  const hitung = j => daftar.filter(b => jenisStok(b) === j).length;
  const pil = [["", "Semua", daftar.length], ["ada", "Ada stok", hitung("ada")], ["nol", "Kosong", hitung("nol")], ["minus", "Minus", hitung("minus")]];
  isi.innerHTML = `<div class="judul-cari">${kepalaModul("stok")}<input id="sCari" autocomplete="off" placeholder="Cari nama barang">
      <div class="pil">${pil.map(([k, n, jml], i) => `<button class="tipis${i ? "" : " kini"}" data-pil="${k}">${n} (${jml})</button>`).join("")}</div></div>
    ${daftar.length ? `<div class="petak">${daftar.map(b => `<div class="ubin ${jenisStok(b)}" data-jenis="${jenisStok(b)}"><span>${aman(b.nama)}</span><b class="${b.stok < 0 ? "minus" : ""}">${angka(b.stok)}</b></div>`).join("")}</div>`
      : '<div class="kartu">Belum ada barang.</div>'}
    <div class="catatan">Stok tersedia = semua barang masuk dikurangi semua barang keluar. Angka merah berarti minus.</div>`;
  let pilih = "";
  const saringStok = () => {
    const kata = kunci(el("sCari").value);
    isi.querySelectorAll(".ubin").forEach(u => { u.hidden = (!!pilih && u.dataset.jenis !== pilih) || (!!kata && !u.textContent.toLowerCase().includes(kata)); });
  };
  el("sCari").addEventListener("input", saringStok);
  isi.querySelectorAll("[data-pil]").forEach(t => t.addEventListener("click", () => {
    pilih = t.dataset.pil;
    isi.querySelectorAll("[data-pil]").forEach(x => x.classList.toggle("kini", x === t));
    saringStok();
  }));
  el("sCari").focus();
}

function tabelLaporan(baris, kosong) {
  if (!baris.length) return `<div class="gulung" id="tabelUtama"><div class="kosong">${kosong}</div></div>`;
  return `<div class="gulung" id="tabelUtama"><table><thead><tr><th>ID</th><th>Tanggal</th><th>Pelanggan</th><th>Nama barang</th><th class="angka">Masuk</th><th class="angka">Keluar</th><th class="angka">Harga</th><th></th></tr></thead><tbody>${
    baris.map(t => `<tr data-nilai="${t.nilai ?? 0}"><td>${t.id}</td><td>${tgl(t.tanggal)}</td><td>${t.pelanggan ? aman(t.pelanggan) : "-"}</td><td>${aman(t.barang)}</td>` +
      `<td class="angka">${t.jenis === "masuk" ? angka(t.jumlah) : "0"}</td><td class="angka">${t.jenis === "keluar" ? angka(t.jumlah) : "0"}</td>` +
      `<td class="angka">${t.nilai === null ? "-" : angka(t.nilai)}</td><td class="aksi"><button class="tipis" data-hapus-baris="${t.id}">Hapus</button></td></tr>`).join("")
  }</tbody></table></div>`;
}
function pasangHapusBaris(ulang, idPesan) {
  isi.querySelectorAll("[data-hapus-baris]").forEach(t => t.addEventListener("click", () => duaKali(t, async () => {
    try { await panggil("transaksi/hapus", { id: +t.dataset.hapusBaris }); await muat(); await ulang(); pesan(idPesan, "Baris ID " + t.dataset.hapusBaris + " dihapus.", true); }
    catch (g) { pesan(idPesan, g.message); }
  })));
}

async function layarCatat(jenis, kabar) {
  const keluar = jenis === "keluar";
  const barang = new Map(data.barang.filter(b => b.aktif).map(b => [kunci(b.nama), b]));
  const pelanggan = new Map(data.pelanggan.filter(p => p.aktif).map(p => [kunci(p.nama), p]));
  const kurang = !barang.size ? 'Belum ada barang. Isi dulu <a href="#barang" style="color:#6fb3d2">Master Barang</a>.'
    : keluar && !pelanggan.size ? 'Belum ada pelanggan. Isi dulu <a href="#pelanggan" style="color:#6fb3d2">Master Pelanggan</a>.' : "";
  const terakhir = (await panggil("laporan?jenis=" + jenis + "&batas=30")).baris;
  const barisIsian = () => `<tr><td><input class="bNama besar" list="pilihBarang" autocomplete="off" placeholder="Ketik nama barang"></td>
    <td class="qty"><input class="bQty" inputmode="decimal" autocomplete="off" placeholder="0"></td>${keluar ? '<td class="sub angka"></td>' : ""}
    <td class="buang"><button class="tipis" type="button" data-buang tabindex="-1" aria-label="Buang baris">×</button></td></tr>`;
  isi.innerHTML = `<div class="dua rata"><div>${kepalaModul(jenis)}` + (kurang ? `<div class="kartu">${kurang}</div>` : `<form class="kartu" id="formCatat">
      <div class="isian">${keluar ? '<label>Pelanggan / peti<input id="cPelanggan" list="pilihPelanggan" required autocomplete="off" placeholder="Ketik nama pelanggan"></label>' : ""}
      <label>Tanggal<input id="cTanggal" type="date" required max="${data.hari_ini}" value="${data.hari_ini}"></label></div>
      <table class="baris" style="margin-top:14px"><thead><tr><th>Nama barang</th><th>Qty</th>${keluar ? '<th class="sub angka">Harga</th>' : ""}<th></th></tr></thead><tbody id="cBaris">${barisIsian().repeat(BARIS_AWAL)}</tbody></table>
      <div class="tombol" style="margin-top:8px"><button class="tipis" type="button" id="cTambah">+ Tambah baris</button>${keluar ? '<span class="ringkas" style="margin:0 0 0 auto"><span>Total harga</span><b id="cTotal">0</b></span>' : ""}</div>
      <div class="tombol"><button class="utama" type="submit">Simpan barang ${jenis}</button></div><div class="pesan" id="cPesan"></div>
      ${keluar ? "" : '<div class="catatan">Qty boleh minus untuk koreksi stok, contoh: -19,5</div>'}</form>`) +
    `</div><div><h2>30 baris barang ${jenis} terakhir</h2><div class="pesan" id="rPesan" style="margin-top:0"></div>` + tabelLaporan(terakhir, `Belum ada catatan barang ${jenis}.`) + "</div></div>";
  pasangHapusBaris(() => layarCatat(jenis), "rPesan");
  if (kurang) return;
  if (kabar) pesan("cPesan", kabar, true);
  const tubuh = el("cBaris");
  const baca = () => [...tubuh.rows].map(r => {
    const nama = r.querySelector(".bNama"), qty = r.querySelector(".bQty");
    return { r, nama, qty, b: barang.get(kunci(nama.value)), jumlah: bacaAngka(qty.value), kosong: !nama.value.trim() && !qty.value.trim() };
  });
  const hitung = () => {
    if (!keluar) return;
    let total = 0;
    for (const x of baca()) {
      const sub = x.b && x.jumlah > 0 ? Math.round(x.jumlah * x.b.harga) : null;
      x.r.querySelector(".sub").textContent = sub === null ? "" : angka(sub);
      total += sub || 0;
    }
    el("cTotal").textContent = angka(total);
  };
  tubuh.addEventListener("input", e => { e.target.classList.remove("salah"); hitung(); });
  tubuh.addEventListener("click", e => {
    if (!e.target.closest("[data-buang]")) return;
    e.target.closest("tr").remove();
    if (!tubuh.rows.length) tubuh.insertAdjacentHTML("beforeend", barisIsian());
    hitung();
  });
  el("cTambah").addEventListener("click", () => { tubuh.insertAdjacentHTML("beforeend", barisIsian()); tubuh.lastElementChild.querySelector(".bNama").focus(); });
  // Enter di kolom qty baris terakhir = baris baru, supaya bisa mengetik terus tanpa tetikus
  tubuh.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const baris = e.target.closest("tr");
    if (e.target.classList.contains("bNama")) return baris.querySelector(".bQty").focus();
    if (!baris.nextElementSibling) tubuh.insertAdjacentHTML("beforeend", barisIsian());
    baris.nextElementSibling.querySelector(".bNama").focus();
  });
  el("formCatat").addEventListener("submit", async e => {
    e.preventDefault();
    const terisi = baca().filter(x => !x.kosong);
    let salah = "";
    for (const x of terisi) {
      const namaSalah = !x.b, qtySalah = !(keluar ? x.jumlah > 0 : x.jumlah !== 0 && !Number.isNaN(x.jumlah));
      x.nama.classList.toggle("salah", namaSalah); x.qty.classList.toggle("salah", qtySalah);
      if (!salah && namaSalah) salah = `Barang "${x.nama.value.trim()}" tidak ada di Master Barang. Pilih dari daftar yang muncul saat mengetik.`;
      if (!salah && qtySalah) salah = `Qty ${x.b.nama} belum benar. Contoh: 12 atau 1,5`;
    }
    const badan = { tanggal: el("cTanggal").value, jenis, baris: terisi.map(x => ({ barang_id: x.b?.id, jumlah: x.jumlah })) };
    let p = null;
    if (keluar) {
      p = pelanggan.get(kunci(el("cPelanggan").value));
      el("cPelanggan").classList.toggle("salah", !p);
      if (!p) salah = `Pelanggan "${el("cPelanggan").value.trim()}" tidak ada di Master Pelanggan. Pilih dari daftar yang muncul saat mengetik.`;
      else badan.pelanggan_id = p.id;
    }
    if (!salah && !terisi.length) salah = "Isi paling sedikit satu barang.";
    if (salah) return pesan("cPesan", salah);
    const tombol = e.target.querySelector("button.utama"); tombol.disabled = true;
    try {
      const hasil = await panggil("transaksi", badan);
      await muat();
      await layarCatat(jenis, `Tersimpan ${hasil.id.length} barang ${jenis}` + (keluar ? ` untuk ${p.nama}, total harga ${angka(hasil.total)}.` : "."));
    } catch (g) { pesan("cPesan", g.message); tombol.disabled = false; }
  });
  (keluar ? el("cPelanggan") : tubuh.querySelector(".bNama")).focus();
}

async function layarLaporan(kabar) {
  const tanya = "laporan?dari=" + saring.dari + "&sampai=" + saring.sampai;
  const { baris, penuh } = await panggil(tanya);
  isi.innerHTML = kepalaModul("laporan") + `
    <div class="kartu" style="margin-bottom:16px"><div class="saring">
      <label class="cari">Pencarian<input id="lCari" autocomplete="off" placeholder="Nama pelanggan, nama barang, atau tanggal"></label>
      <label>Dari tanggal<input id="lDari" type="date" value="${saring.dari}"></label>
      <label>Sampai tanggal<input id="lSampai" type="date" value="${saring.sampai}"></label>
      <button class="utama" id="lTampil">Tampilkan</button><button class="tipis" id="lSemua">Semua tanggal</button><button class="tipis" id="lUnduh">Unduh Excel</button>
      <div class="ringkas"><span>Saldo</span><b id="lSaldo">0</b><span id="lJumlah"></span></div></div>
      <div class="pesan" id="lPesan"></div></div>` + tabelLaporan(baris, "Tidak ada catatan pada tanggal ini.") +
    (penuh ? '<div class="catatan">Hanya 5.000 baris terbaru yang ditampilkan. Persempit tanggal, atau pakai Unduh Excel untuk semua baris.</div>' : "") +
    '<div class="catatan">Saldo = jumlah kolom Harga dari baris yang sedang tampil. Baris terbaru di atas.</div>';
  if (kabar) pesan("lPesan", kabar, true);
  const hitung = () => {
    const kata = kunci(el("lCari").value);
    let saldo = 0, tampak = 0;
    isi.querySelectorAll("#tabelUtama tbody tr").forEach(b => {
      b.hidden = !!kata && !b.textContent.toLowerCase().includes(kata);
      if (!b.hidden) { saldo += +b.dataset.nilai; tampak++; }
    });
    el("lSaldo").textContent = rupiah(saldo); el("lJumlah").textContent = tampak + " baris";
  };
  el("lCari").addEventListener("input", hitung); hitung();
  const ulang = async () => { try { await layarLaporan(); } catch (g) { pesan("lPesan", g.message); } };
  el("lTampil").addEventListener("click", () => { saring = { dari: el("lDari").value, sampai: el("lSampai").value }; ulang(); });
  el("lSemua").addEventListener("click", () => { saring = { dari: "", sampai: "" }; ulang(); });
  pasangHapusBaris(() => layarLaporan(), "lPesan");
  el("lUnduh").addEventListener("click", async () => {
    try {
      const jawab = await panggil("unduh.xlsx");
      const nama = (/filename="([^"]+)"/.exec(jawab.headers.get("Content-Disposition") || "") || [])[1] || "Stok Menyan.xlsx";
      const tautan = document.createElement("a");
      tautan.href = URL.createObjectURL(await jawab.blob()); tautan.download = nama;
      document.body.append(tautan); tautan.click(); tautan.remove();
      setTimeout(() => URL.revokeObjectURL(tautan.href), 30000);
      pesan("lPesan", "Berkas diunduh: " + nama, true);
    } catch (g) { pesan("lPesan", g.message); }
  });
}

// ---------- pengatur ----------
async function tampil() {
  if (!sesi) {
    try { layarMasuk((await panggil("status")).siap); } catch (g) { kotakGagal(g); }
    return;
  }
  const k = location.hash.slice(1);
  if (k !== "laporan") saring = { dari: "", sampai: "" };
  try {
    await muat();
    el("tombolSegar").hidden = el("tombolKeluar").hidden = el("nav").hidden = false;
    const modulKini = MODUL.some(m => m[0] === k) ? k : "";
    el("nav").querySelectorAll("a").forEach(a => a.classList.toggle("kini", a.getAttribute("href") === "#" + modulKini));
    if (!modulKini) return layarMenu();
    document.body.className = "";
    window.scrollTo(0, 0);
    if (k === "barang" || k === "pelanggan") layarMaster(k);
    else if (k === "stok") layarStok();
    else if (k === "laporan") await layarLaporan();
    else await layarCatat(k);
  } catch (g) { if (sesi) kotakGagal(g); }
}
window.addEventListener("hashchange", () => { ubah = null; tampil(); });
el("tombolSegar").addEventListener("click", tampil);
el("tombolKeluar").addEventListener("click", async () => {
  try { await panggil("keluar", {}); } catch (g) { /* sesi di server habis sendiri dalam 12 jam */ }
  lupaSesi(); location.hash = ""; tampil();
});
tampil();
</script>
</body></html>
